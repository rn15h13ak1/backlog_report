[project]
name = "backlog-weekly-report"
version = "0.1.0"
description = "Backlog の課題を期間集計して Markdown レポートを生成するスクリプト"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# カバレッジ計測は常時ではなく --cov を付けたときだけ実行する。
#   python -m pytest tests/ --cov                    # 数値だけ
#   python -m pytest tests/ --cov --cov-report=term-missing   # 未到達行も表示
#   python -m pytest tests/ --cov --cov-report=html           # htmlcov/index.html
[tool.coverage.run]
source = ["backlog_weekly_report"]

[tool.coverage.report]
show_missing = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# 差分テスト用に旧実装を凍結したコピー。原文どおり保持するため Lint 対象外にする。
extend-exclude = ["tests/_legacy.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # 行長は line-length で管理（日本語コメントが多いため緩める）
]
