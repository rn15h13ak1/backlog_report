[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backlog-weekly-report"
# CHANGELOG.md の最新の節に合わせる。
version = "0.6.0"
description = "Backlog の課題を期間集計して Markdown レポートを生成するスクリプト"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

# 入口の 2 つのスクリプトと、実装のパッケージを対象にする。
# 指定しないと setuptools がトップレベルのモジュールを複数見つけて自動判別を中止する。
[tool.setuptools]
py-modules = ["backlog_weekly_report", "check_api"]
packages = ["backlog_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# カバレッジ計測は常時ではなく --cov を付けたときだけ実行する。
#   python -m pytest tests/ --cov                    # 数値だけ
#   python -m pytest tests/ --cov --cov-report=term-missing   # 未到達行も表示
#   python -m pytest tests/ --cov --cov-report=html           # htmlcov/index.html
[tool.coverage.run]
# 入口と、実装のパッケージの両方を測る。入口だけにすると、分割後は 111 行しか
# 測らない状態になる。
source = ["backlog_weekly_report", "backlog_report"]

[tool.coverage.report]
show_missing = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

# 型の検査。集計データの辞書（ReportData）のキー名の打ち間違い、値の型の取り違え、
# 列の中身（ColumnEntry）をタプルのまま渡すといった誤りを、実行する前に見つける。
# 「任意のキーを .get せずに読む」ことは mypy では検出できないため、そこは宣言の
# 読み物としての意味になる。
#   python -m mypy backlog_weekly_report.py check_api.py
[tool.mypy]
python_version = "3.10"
files = ["backlog_weekly_report.py", "check_api.py", "backlog_report"]
# 注釈を付けていない関数の中身までは見ない（段階的に付けるため）。
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py310"
# 差分テスト用に旧実装を凍結したコピー。原文どおり保持するため Lint 対象外にする。
extend-exclude = ["tests/_legacy.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # 行長は line-length で管理（日本語コメントが多いため緩める）
]
